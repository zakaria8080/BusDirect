<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body style="display: grid; gap: 30px; justify-items: center;">
    <header class="bg-[#0a0c36] text-white px-8 py-4 flex items-center justify-between shadow-lg" style="width: 100vw;">

        <div class="flex items-center gap-4">
            <img src="img/شهاب_الجنوب_Blue_Luxury_Coach_Bus-removebg-preview.png" alt="BusDirect Logo"
                class="h-12 w-auto object-contain">
            <h1 class="text-2xl font-bold tracking-wide">BusDirect</h1>
        </div>

        <div class="flex items-center gap-4 text-xl font-medium">
            <span>Ticket : <span id="ticket-count">0</span></span>
            <i
                class="fa-solid fa-cart-shopping cursor-pointer hover:text-gray-300 transition-colors relative top-[3px]"></i>
            <i class="fa-solid fa-ticket cursor-pointer hover:text-gray-300 transition-colors relative top-[2px]"></i>
        </div>
    </header>
    <section
        style="width: 80%; background-color: #0a0c36; padding: 10px; display: flex; justify-content: center; align-items: center; color: white; border-radius: 25px;">
        <div class="title-h1">
            <h1 class="title-h1" id="first-title" style="font-size: 3rem;">Safi <i class="fa-solid fa-arrow-right"></i>
                Marrakech</h1>
            <p class="first-paragraph" style="text-align: center; color: oklch(86.9% 0.022 252.894); ">20-seat coach ·
                80 DH per seat</p>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
