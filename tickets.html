<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>BusDirect — Boarding Tickets</title>
    <meta name="description" content="Current boarding tickets for the Safi → Marrakech route." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="tailwind.css">
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
    <a href="#main"
        class="absolute left-[-9999px] top-0 z-50 rounded-br-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white focus:left-0">Skip
        to main content</a>

    <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900 text-white">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
            <a href="./index.html" aria-label="BusDirect home" class="flex min-w-0 items-center gap-2.5 rounded-lg">
                <span class="flex rounded-xl bg-teal-500/10 p-1.5 shadow-[0_0_0_1px_rgb(45_212_191_/_0.25)]">
                    <img src="./assets/bus.svg" alt="" aria-hidden="true"
                        class="h-6 w-6 [filter:invert(74%)_sepia(66%)_saturate(407%)_hue-rotate(124deg)_brightness(96%)_contrast(90%)]" />
                </span>
                <span class="min-w-0">
                    <span
                        class="block overflow-hidden text-ellipsis whitespace-nowrap text-lg font-bold tracking-tight">BusDirect</span>
                    <span
                        class="hidden text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-400 sm:block">Seat
                        reservations</span>
                </span>
            </a>
            <nav aria-label="Primary"
                class="flex shrink-0 items-center gap-1 rounded-xl border border-slate-700/80 bg-slate-800/60 p-1">
                <a href="./index.html"
                    class="inline-flex min-h-11 items-center gap-2 rounded-lg px-2.5 py-2 text-sm font-semibold text-slate-300 transition-colors hover:bg-slate-700 hover:text-white sm:px-4">
                    <span class="inline sm:hidden">Seats</span>
                    <span class="hidden sm:inline">Seat management</span>
                </a>
                <a href="./tickets.html" aria-current="page"
                    class="inline-flex min-h-11 items-center gap-2 rounded-lg bg-teal-500 px-2.5 py-2 text-sm font-semibold text-slate-950 shadow-sm transition-colors hover:bg-teal-500 sm:px-4">
                    <img src="img/heroicons_ticket.svg" alt="" aria-hidden="true"
                        class="h-4 w-4 shrink-0 [filter:brightness(0)]" />
                    Tickets
                </a>
            </nav>
        </div>
    </header>

    <main id="main" class="mx-auto max-w-6xl scroll-mt-16 px-4 py-6 sm:px-6">
        <h1 class="mb-1 text-2xl font-bold">Boarding tickets</h1>
        <p class="mb-6 text-sm text-slate-600">All current reservations · Ticket price is fixed at 80 DH per seat.</p>
        <div id="tickets-grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
        <div id="tickets-empty"
            class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center hidden">
            <img src="./assets/heroicons_ticket.svg" alt="" aria-hidden="true"
                class="mx-auto mb-3 h-10 w-10 [filter:brightness(0)_saturate(100%)_invert(87%)_sepia(7%)_saturate(253%)_hue-rotate(176deg)_brightness(96%)_contrast(88%)]" />
            <p class="font-semibold text-slate-700">No tickets yet</p>
            <p class="mt-1 text-sm text-slate-500">Create a reservation on the <a
                    class="font-semibold text-teal-700 underline hover:text-teal-800" href="./index.html">seat
                    management page</a> to issue boarding tickets.</p>
        </div>
    </main>
</body>

</html>
